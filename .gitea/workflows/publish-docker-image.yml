name: Publish Docker image
on:
    push:
        branches: master
jobs:
    publish_latest:
        name: Publish latest image
        needs: build
        if: gitea.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Download build artifact
                uses: actions/download-artifact@v8
                with:
                    name: build
                    path: build

            -   name: Setup QEMU
                uses: docker/setup-qemu-action@v4

            -   name: Cache Docker layers
                uses: actions/cache@v5
                with:
                    path: /tmp/.buildx-cache
                    key: ${{ runner.os }}-buildx-${{ gitea.sha }}
                    restore-keys: |
                        ${{ runner.os }}-buildx-

            -   name: Set up Buildx
                uses: docker/setup-buildx-action@v3
                with:
                    driver-opts: |
                        network=gitea_internal
                    config-inline: |
                        [registry."${{ secrets.REGISTRY_HOST }}"]
                          http = true
                          insecure = true

            -   name: Log in to Gitea Container Registry
                uses: docker/login-action@v4
                with:
                    registry: ${{ secrets.HOST }}
                    username: ${{ secrets.USERNAME }}
                    password: ${{ secrets.TOKEN }}

            -   name: Fix Docker credentials registry
                run: |
                    sed -i "s#${{ secrets.HOST }}#${{ secrets.REGISTRY_HOST }}#g" \
                      "${DOCKER_CONFIG:-$HOME/.docker}/config.json"

            -   name: Publish tagged image
                uses: docker/build-push-action@v7
                with:
                    context: .
                    push: true
                    platforms: linux/arm64
                    cache-from: type=local,src=/tmp/.buildx-cache
                    cache-to: type=local,mode=max,dest=/tmp/.buildx-cache
                    tags: ${{ secrets.REGISTRY_HOST }}/${{ gitea.repository }}:latest
